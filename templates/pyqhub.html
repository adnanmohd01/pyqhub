<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PYQs HUB - Invertis University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% include 'components/nav.html' %}

    <img src="{{ url_for('static', filename='images/invertis_cover.jpeg') }}" class="cover-img"
        alt="Invertis University Cover">

    <div class="cards">
        {% for card in cards %}
        <div class="card-body">
            <img src="{{ url_for('static', filename=card.image) }}" class="card-img-top"
                alt="{{ card.title }} Question Papers">
            <h5 class="card-title">{{ card.title }}</h5>
            <p class="card-text">{{ card.description }}</p>
            <a href="{{ url_for(card.endpoint) if card.endpoint else '#' }}" class="btn btn-primary">{{ card.button_text }}</a>
        </div>
        {% endfor %}
    </div>

    <hr>

    {% include 'components/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
